# Publicación en Render Free + Neon Free, prueba privada 1.2.
# Crear con el conector, pasando DATABASE_URL y contraseñas como secretos.
services:
  - type: web
    name: argentex-cotizador-ios
    runtime: python
    region: ohio
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /tmp/argentex-data
      - key: DATABASE_URL
        sync: false
      - key: APP_ADMIN_PASSWORD
        sync: false
      - key: APP_SECRET
        generateValue: true
